name: Artillery Quick Smoke

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quick-smoke:
    name: Quick smoke load
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run quick smoke Artillery profile
        run: npm run artillery:quick

      - name: Generate quick smoke HTML report
        run: npm run artillery:report:quick

      - name: Upload quick smoke Artillery report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artillery-quick-report
          path: artillery-report/quick-smoke.html
          if-no-files-found: error
